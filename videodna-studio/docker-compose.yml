# VideoDNA Studio — local stack.
#
#   Windows:      powershell -ExecutionPolicy Bypass -File .\iniciar.ps1
#   Linux/macOS:  docker compose up -d --build
#
#   http://localhost:3000        studio
#   http://localhost:8000/docs   API (OpenAPI)
#
# Default storage is the local filesystem (a volume shared by api and worker),
# so only two images are built and nothing is compiled from source. To run the
# S3 path with MinIO — the same code path as AWS S3 / Cloudflare R2 — add the
# override file (see docker-compose.s3.yml):
#   docker compose -f docker-compose.yml -f docker-compose.s3.yml up -d --build
#
# Published ports listen on 127.0.0.1 only: the dev stack logs everyone in
# automatically (AUTH_DEV_AUTOLOGIN) and must not be reachable from the network.
# Services restart with Docker Desktop, so the studio is back after a reboot.
#
# Everything runs in AI_MOCK_MODE by default: no API keys, no credits spent.
# Behind a TLS-intercepting proxy, export EXTRA_CA_CERT=/path/to/proxy-ca.pem
# before building (see README).

name: videodna-studio

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-development}
  DATABASE_URL: postgresql+psycopg://videodna:videodna@postgres:5432/videodna
  REDIS_URL: redis://redis:6379/0
  QUEUE_BACKEND: dramatiq
  STORAGE_BACKEND: local
  STORAGE_LOCAL_ROOT: /data/storage
  # Signed media URLs are opened by the browser, so they use the host name.
  API_BASE_URL: ${API_BASE_URL:-http://localhost:8000}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
  AI_MOCK_MODE: ${AI_MOCK_MODE:-true}
  AUTH_DEV_AUTOLOGIN: ${AUTH_DEV_AUTOLOGIN:-true}
  JWT_SECRET: ${JWT_SECRET:-dev-insecure-change-me-not-for-production}
  SIGNING_SECRET: ${SIGNING_SECRET:-dev-insecure-change-me-not-for-production}
  FEATURE_FLAGS: ${FEATURE_FLAGS:-}
  LOG_JSON: "true"

x-backend-build: &backend-build
  context: ./apps/api
  secrets: [ca]

services:
  postgres:
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: videodna
      POSTGRES_PASSWORD: videodna
      POSTGRES_DB: videodna
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U videodna -d videodna"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    restart: unless-stopped
    build: *backend-build
    image: videodna/api:local
    environment: *backend-env
    ports: ["127.0.0.1:8000:8000"]
    volumes: [storage:/data/storage]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    restart: unless-stopped
    image: videodna/api:local
    # Same image as the api; built by the api service. "never" keeps compose
    # from trying to pull it from a registry before the api build finishes.
    pull_policy: never
    command: ["videodna", "worker", "--processes", "1", "--threads", "2"]
    environment: *backend-env
    healthcheck:
      disable: true
    volumes: [storage:/data/storage, workdata:/data/work]
    depends_on:
      api: { condition: service_healthy }

  web:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      secrets: [ca]
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    image: videodna/web:local
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api: { condition: service_healthy }

secrets:
  ca:
    file: ${EXTRA_CA_CERT:-./infra/no-extra-ca.pem}

volumes:
  pgdata:
  storage:
  workdata:
