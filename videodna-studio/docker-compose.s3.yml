# Optional: S3 storage through MinIO, the same code path as AWS S3 / Cloudflare R2
# (browser uploads straight to the bucket with presigned multipart URLs).
#
#   docker compose -f docker-compose.yml -f docker-compose.s3.yml up -d --build
#   Windows: powershell -ExecutionPolicy Bypass -File .\iniciar.ps1 -S3
#
# The first build compiles MinIO from source (several minutes; see
# docs/architecture-decisions/0009-minio-built-from-source.md).
# Console: http://localhost:9001 (videodna / videodna-secret).

x-s3-env: &s3-env
  STORAGE_BACKEND: s3
  S3_ENDPOINT_URL: http://minio:9000
  # Presigned URLs are opened by the browser, so they must use the host name.
  S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
  S3_BUCKET: ${S3_BUCKET:-videodna}
  S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-videodna}
  S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-videodna-secret}

services:
  minio:
    build:
      context: ./infra/minio
      secrets: [ca]
    image: videodna/minio:local
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-videodna}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-videodna-secret}
      # Browser uploads PUT parts straight to MinIO and must read the ETag header.
      MINIO_API_CORS_ALLOW_ORIGIN: ${CORS_ORIGINS:-http://localhost:3000}
    restart: unless-stopped
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [miniodata:/data]

  api:
    environment: *s3-env
    depends_on:
      minio: { condition: service_started }

  worker:
    environment: *s3-env

volumes:
  miniodata:
