[project]
name = "videodna"
version = "0.1.0"
description = "VideoDNA Studio backend: API, AI orchestrator, analysis/generation pipelines and workers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141,<0.143",
    "uvicorn[standard]>=0.53,<0.55",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "sqlalchemy>=2.0.54,<2.1",
    "alembic>=1.20,<2",
    "psycopg[binary]>=3.3,<4",
    "redis>=8.1,<9",
    "dramatiq[redis]>=2.2,<3",
    "boto3>=1.43,<2",
    "pyjwt>=2.14,<3",
    "pyyaml>=6.0.3,<7",
    "python-multipart>=0.0.32",
    "email-validator>=2.2,<3",
]

[project.scripts]
videodna = "videodna.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "moto[s3]>=5.2,<6",
    "httpx2>=2.13,<3",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/videodna"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "ffmpeg: needs the ffmpeg/ffprobe binaries on PATH",
    "postgres: needs TEST_DATABASE_URL pointing at a PostgreSQL database",
]
